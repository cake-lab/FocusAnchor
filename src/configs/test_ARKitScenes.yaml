# pytorch_lightning==2.6.1
seed_everything: 0
trainer:
  accelerator: auto
  devices: 1  # one GPU, so the test set is not split across processes
  logger:
    class_path: pytorch_lightning.loggers.TensorBoardLogger
    init_args:
      save_dir: 'reports/logs'
      name: 'arkitscenes_test'
model:
  invert_depth: True  # batch is in metres; the model works in 1/depth
  lr: 2e-4
  wd: 1e-5
  dinov2_encoder: vitl
  prior_fusion: input
  train_iters: 12
  valid_iters: 16
  scale_iters: 4
data:
  # FOSSA's Table 3 protocol, as for iBims and HAMMER: a stack rendered from the GT,
  # see src/dataloader/RGBD/loader.py. 1920x1440 is resized to 480x640.
  class_path: dataloader.dataset.RGBDDataModule
  init_args:
    root: '/project/arkitscenes/upsampling'
    dataset: arkit
# Zero-shot. FocusAnchor, the NYU zero-shot recipe with confidence fusion, last epoch.
# FocusAnchor-flex: --ckpt_path checkpoints/FocusAnchor-RS.ckpt.
ckpt_path: checkpoints/FocusAnchor.ckpt
